{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Авторизация{% endblock %}</title>

    <!-- Google Fonts Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- jQuery + Inputmask -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.9/jquery.inputmask.min.js"></script>

    {% block extra_head %}{% endblock %}
    <script>
        const input = document.getElementById('phone');

        input.addEventListener('input', () => {
            let numbers = input.value.replace(/\D/g, '');

            if (numbers.startsWith('8')) {
                numbers = '7' + numbers.slice(1);
            }

            if (!numbers.startsWith('7')) {
                numbers = '7' + numbers;
            }

            let formatted = '+7';

            if (numbers.length > 1) {
                formatted += ' (' + numbers.slice(1, 4);
            }
            if (numbers.length >= 5) {
                formatted += ') ' + numbers.slice(4, 7);
            }
            if (numbers.length >= 8) {
                formatted += '-' + numbers.slice(7, 9);
            }
            if (numbers.length >= 10) {
                formatted += '-' + numbers.slice(9, 11);
            }

            input.value = formatted;
        });
    </script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            background: #0a0a1f;
        }

        .video-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
        }

        .video-bg {
            position: absolute;
            inset: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.68);
            z-index: -1;
        }

        .auth-form-container {
            position: fixed;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 100%;
            max-width: 400px;
            /* Уменьшили */
            padding: 0 20px;
            margin-top: 40px;
            margin-bottom: 40px;
            /* Вертикальные отступы */
        }

        .auth-form {
            background: rgba(35, 35, 55, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 32px 24px;
            /* Уменьшили */
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
        }

        .form-title {
            text-align: center;
            margin-bottom: 28px;
            font-size: 26px;
            /* Уменьшили */
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d0d0e0;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            /* Уменьшили */
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3390ff;
            box-shadow: 0 0 0 4px rgba(51, 144, 255, 0.22);
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: #1e90ff;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.28s;
        }

        .btn-auth:hover {
            background: #0c7ae6;
            transform: translateY(-2px);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .form-footer a {
            color: #60a5fa;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.25);
            border: 1px solid #dc3545;
        }

        .alert-warning {
            background: rgba(255, 193, 7, 0.18);
            border: 1px solid #ffc107;
        }

        /* Модалка для верификации */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(35, 35, 55, 0.9);
            border-radius: 16px;
            padding: 24px;
            max-width: 360px;
            text-align: center;
            color: white;
        }

        .modal-content input {
            margin: 16px 0;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-content button {
            padding: 12px;
            width: 100%;
            background: #1e90ff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .auth-form-container {
                padding: 0 15px;
                /* Горизонтальные отступы 15px */
                max-width: calc(100% - 30px);
                /* 15px с каждой стороны */
            }

            .auth-form {
                padding: 28px 20px;
            }

            .form-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="video-background">
        <video autoplay muted loop playsinline class="video-bg">
            <source src="{% static 'videos/background2.mp4' %}" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
        <div class="overlay"></div>
    </div>

    <div class="auth-form-container">
        <div class="auth-form">
            {% block auth_content %}
            <!-- Контент login/register -->
            {% endblock %}
        </div>
    </div>

    <!-- Модалка для верификации (общая) -->
    <div id="verification-modal" class="modal">
        <div class="modal-content">
            <h3>Подтверждение номера</h3>
            <p>Мы отправили код на ваш телефон. Введите его ниже.</p>
            <form id="verification-form">
                <input type="text" id="verification-code" placeholder="Введите код" maxlength="6">
                <button type="submit">Подтвердить</button>
            </form>
            <p id="verification-error" style="color: red; display: none;">Неверный код. Попробуйте снова.</p>
        </div>
    </div>

    {% block extra_js %}{% endblock %}

</body>

</html>
