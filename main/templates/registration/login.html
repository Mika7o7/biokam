{% load static %}


<!-- {% block title %}Вход{% endblock %} -->

{% block content %}

<!-- jQuery сначала (обязательно перед Inputmask) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<!-- Inputmask -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.9/jquery.inputmask.min.js"></script>

<!-- Inputmask для красивой маски телефона -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.9/jquery.inputmask.min.js"></script>

<script>
  $(document).ready(function () {
    $('#phone-input').inputmask({
      mask: '+7 (999) 999-99-99',
      placeholder: "_",
      showMaskOnHover: false,
      showMaskOnFocus: true
    });
  });
</script>

<!-- Полноэкранный видео-фон -->
<div class="video-background">
  <video autoplay muted loop playsinline class="video-bg">
    <source src="{% static 'videos/background2.mp4' %}" type="video/mp4">
    Ваш браузер не поддерживает видео.
  </video>
  <!-- Затемнение -->
  <div class="overlay"></div>
</div>

<!-- Полупрозрачная форма по центру -->
<div class="login-form-container">
  <div class="login-form">
    <h2 class="form-title">Вход в аккаунт</h2>

    {% if form.errors %}
    <div class="alert alert-danger">
      Ошибка входа. Проверьте логин и пароль.
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="id_username">Логин / Email</label>
        {{ form.username }}
      </div>

      <div class="form-group">
        <label for="id_password">Пароль</label>
        {{ form.password }}
      </div>

      <button type="submit" class="btn-login">Войти</button>

      <div class="form-footer">
        <a href="{% url 'password_reset' %}">Забыли пароль?</a>
        <span> | </span>
        <a href="{% url 'register' %}">Регистрация</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block extra_css %}
<style>
  /* Видео-фон на весь экран */
  .video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -2;
  }

  .video-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 106%;
    min-height: 106%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
  }

  /* Затемнение */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.65);
    /* тёмный полупрозрачный слой */
    z-index: -1;
  }

  /* Форма по центру */
  .login-form-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 0 20px;
  }

  .login-form {
    background: rgba(40, 40, 60, 0.75);
    /* полупрозрачный серый */
    backdrop-filter: blur(10px);
    /* эффект стекла (очень красиво) */
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px 30px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
  }

  .form-title {
    text-align: center;
    margin-bottom: 30px;
    font-size: 28px;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #ddd;
  }

  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 16px;
  }

  .form-group input:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: #007bff;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-login:hover {
    background: #0056b3;
    transform: translateY(-2px);
  }

  .form-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
  }

  .form-footer a {
    color: #4da6ff;
    text-decoration: none;
  }

  .form-footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .login-form {
      padding: 30px 20px;
    }
  }
.login-form,
.login-form * {
  font-family: 'Roboto', sans-serif !important;
}

.form-title {
  font-weight: 700;
}

.form-group label {
  font-weight: 500;
}
</style>
{% endblock %}
