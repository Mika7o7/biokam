{% extends 'main/base.html' %}
{% load static %}


{% block content %}
<div class="container">
    <ul class="breadcrumb">
        <li><a href="{% url 'account' %}"><i class="fa fa-home"></i></a></li>
        <li><a href="{% url 'account' %}">Личный кабинет</a></li>
    </ul>
</div>
<div id="account-password" class="container">

    <div class="row">

        <!-- Вставляем сайдбар -->
        {% include 'main/account_sidebar.html' %}
        <div id="content" class="col-sm-9">
            <h1>Изменение пароля</h1>
        <form id="change-password-form" method="post">
            {% csrf_token %}
        
            <!-- Текущий пароль -->
            <div class="mb-3">
                <label for="current_password" class="form-label">
                    <i class="bi bi-key me-1"></i> Текущий пароль *
                </label>
                <input type="password" class="form-control" id="current_password" name="current_password" required>
            </div>
        
            <!-- Новый пароль -->
            <div class="mb-4">
                <label for="new_password1" class="form-label">
                    <i class="bi bi-shield-lock me-1"></i> Новый пароль *
                </label>
                <input type="password" class="form-control" id="new_password1" name="new_password1" required minlength="8">
            </div>
        
            <!-- Подтверждение нового пароля -->
            <div class="mb-4">
                <label for="new_password2" class="form-label">
                    <i class="bi bi-shield-check me-1"></i> Подтверждение нового пароля *
                </label>
                <input type="password" class="form-control" id="new_password2" name="new_password2" required minlength="8">
            </div>
            <br>
            <!-- Кнопки -->
            <div class="mb-4">
                <button type="submit" class="btn btn-primary tiffany_blue_btn" id="change-password-btn">
                    <i class="bi bi-check-lg me-1"></i> Изменить пароль
                </button>
                <a href="{% url 'account' %}" class="btn btn-outline-secondary ms-2">
                    <i class="bi bi-arrow-left me-1"></i> Назад
                </a>
            </div>
        </form>
        
        <div id="password-message" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('change-password-form');
        const submitBtn = document.getElementById('change-password-btn');
        const messageDiv = document.getElementById('password-message');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // Простая валидация
            const currentPassword = document.getElementById('current_password').value.trim();
            const newPassword1 = document.getElementById('new_password1').value.trim();
            const newPassword2 = document.getElementById('new_password2').value.trim();

            if (!currentPassword || !newPassword1 || !newPassword2) {
                alert('Заполните все поля');
                return;
            }

            if (newPassword1 !== newPassword2) {
                alert('Новые пароли не совпадают');
                return;
            }

            // Отправка AJAX
            const formData = new FormData(this);
            const originalText = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Изменение...';

            fetch("{% url 'change_password_api' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        messageDiv.innerHTML =
                            `<div class="alert alert-success">${data.message}</div>`;
                        form.reset();

                        setTimeout(() => {
                            window.location.href = "{% url 'account' %}";
                        }, 2000);
                    } else {
                        messageDiv.innerHTML =
                            `<div class="alert alert-danger">${data.message}</div>`;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    messageDiv.innerHTML =
                        `<div class="alert alert-danger">Ошибка сети</div>`;
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                });
        });
    });
</script>
{% endblock %}
